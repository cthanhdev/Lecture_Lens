# =========================================================================
# LECTURELENS - POSTGRESQL 16 & PGVECTOR 0.7.0+ PRODUCTION CONFIGURATION
# =========================================================================
# Được tối ưu cho máy chủ AI / trạm làm việc On-Premise (RAM >= 16GB - 32GB)
# Phục vụ lưu trữ và truy vấn chỉ mục HNSW vector 1024-d (BGE-M3)
# =========================================================================

# -------------------------------------------------------------------------
# 1. KẾT NỐI VÀ MẠNG (CONNECTIONS & NETWORKING)
# -------------------------------------------------------------------------
listen_addresses = '*'
max_connections = 100
superuser_reserved_connections = 3

# -------------------------------------------------------------------------
# 2. BỘ NHỚ VÀ BỘ ĐỆM (MEMORY & BUFFER TUNING)
# -------------------------------------------------------------------------
# shared_buffers: Bộ nhớ đệm chung. Khuyến nghị 25% tổng RAM máy chủ
# (Với máy 32GB RAM: đặt 8GB; máy 16GB RAM: đặt 4GB)
shared_buffers = 4GB

# effective_cache_size: Ước lượng bộ nhớ khả dụng cho OS cache (50-75% RAM)
effective_cache_size = 12GB

# maintenance_work_mem: Cực kỳ quan trọng để xây dựng chỉ mục HNSW nhanh chóng
# HNSW cần nhiều bộ nhớ trong lúc dựng cây đồ thị đa tầng
maintenance_work_mem = 2GB

# work_mem: Bộ nhớ cho từng phép sắp xếp (Sort / Hash Join / RRF ranking)
work_mem = 64MB

# -------------------------------------------------------------------------
# 3. GHI NHẬT KÝ GIAO DỊCH (WRITE-AHEAD LOGGING - WAL)
# -------------------------------------------------------------------------
# Tối ưu hóa cho kịch bản Batch Insert hàng chục nghìn vector từ bài giảng
wal_buffers = 64MB
checkpoint_completion_target = 0.9
max_wal_size = 16GB
min_wal_size = 2GB
checkpoint_timeout = 15min

# -------------------------------------------------------------------------
# 4. TỐI ƯU HÓA TRUY VẤN VÀ PARALLEL WORKERS
# -------------------------------------------------------------------------
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4
max_parallel_workers = 8

# -------------------------------------------------------------------------
# 5. CẤU HÌNH THAM SỐ ĐẶC THÙ CHO PGVECTOR 0.7.0+
# -------------------------------------------------------------------------
# hnsw.iterative_scan: 'relaxed' hoặc 'strict' (Tính năng mới của 0.7.0+)
# Ngăn ngừa tình trạng mất kết quả (missed hits) khi truy vấn kết hợp lọc WHERE
hnsw.iterative_scan = 'relaxed'

# hnsw.ef_search: Số node ứng viên duyệt trong đồ thị khi tìm kiếm.
# Mặc định là 40. Đặt 60 để cân bằng giữa Recall > 99.2% và Latency < 15ms.
hnsw.ef_search = 60
